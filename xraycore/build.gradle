apply from: '../constants.gradle'
apply plugin: 'com.android.library'

// Wrapper module for the pure-Java v2ray core (v2ray-java, Maven project at
// ../../v2ray). The shaded fat jar (v2ray + netty + jackson + bouncycastle +
// slf4j/logback) is built by build_v2ray.sh and consumed from libs/ because
// Android library modules cannot consume local aar/jar bundles with
// transitive deps directly.
android {
    compileSdkVersion project.ext.compileSdkVersion
    buildToolsVersion project.ext.buildToolsVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion project.ext.minSdkVersion
        targetSdkVersion project.ext.targetSdkVersion

        consumerProguardFiles 'proguard-v2ray.txt'
    }
}

dependencies {
    api files('libs/v2ray-java.jar')
}
